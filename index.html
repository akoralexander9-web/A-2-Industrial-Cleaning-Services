  .card{background:white;padding:35px;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,0.1);border-top:5px solid var(--orange);transition:0.3s;}

  .why-item{text-align:center;padding:25px;background:var(--light);border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.08);transition:0.3s;}
  .why-item:hover{transform:translateY(-5px);}
  .why-item .icon{font-size:3rem;margin-bottom:15px;background:linear-gradient(135deg, var(--orange), var(--navy));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

  .careers{background:linear-gradient(135deg, var(--navy) 0%, #123A5E 100%);color:white;}
  .careers-box{max-width:800px;margin:auto;background:white;padding:50px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.3);color:var(--gray);}

  .contact{background:linear-gradient(135deg, var(--orange) 0%, #e55f00 100%);color:white;}
  form{display:grid;gap:15px;max-width:650px;margin:0 auto;}
  input,textarea{padding:14px;border-radius:8px;border:2px solid transparent;width:100%;font-size:1rem;font-family:inherit;}

  .contact-info a{color:white;text-decoration:none;font-weight:800;background:rgba(10,37,64,0.3);padding:8px 15px;border-radius:20px;display:inline-block;margin:5px;}

  footer{background:#061a2e;color:#ccc;text-align:center;padding:30px 0;font-size:0.9rem;}
  footer a{color:var(--orange);text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  .floating-btn{position:fixed;bottom:25px;right:25px;z-index:999;background:var(--green);color:white;padding:15px 20px;border-radius:50px;font-weight:800;text-decoration:none;box-shadow:0 6px 20px rgba(0,200,81,0.5);animation: pulse 2s infinite;}
  .floating-btn:hover{background:#00b347;}
  @keyframes pulse {0%{box-shadow:0 0 0 0 rgba(0,200,81,0.7);}70%{box-shadow:0 0 0 15px rgba(0,200,81,0);}100%{box-shadow:0 0 0 0 rgba(0,0,0,0);}}

  @media(max-width:768px){

    .hero p{font-size:1.1rem;}
    nav ul{display:none;}
    .logo{font-size:2.2rem;gap:15px;} /* BIGGER MOBILE */
    .logo img{height:120px;} /* 3x of 40px - still big on mobile */
    header{padding:20px 0;}
    section{padding:60px 0;}
  }
</style>
